[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sampan"
dynamic = ["version"]
description = "Save and restore your Claude Code / Codex tmux sessions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "royalroylo" }]
keywords = ["tmux", "claude-code", "codex", "cli", "session-manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/royalroylo/sampan"
Issues = "https://github.com/royalroylo/sampan/issues"
Changelog = "https://github.com/royalroylo/sampan/blob/main/CHANGELOG.md"

[project.scripts]
sampan = "sampan.cli:main"

[tool.hatch.version]
source = "vcs"
# Version used when there is no git info (e.g. installed from a zip)
raw-options = { fallback_version = "0.0.0+unknown" }

[tool.hatch.build.targets.wheel]
packages = ["src/sampan"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501: long lines exist throughout (user-facing zh-TW strings); E741/E731: existing style, not worth churn.
ignore = ["E501", "E741", "E731"]
