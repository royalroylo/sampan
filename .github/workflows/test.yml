name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      # No tmux install needed: the test suite never starts a real tmux
      # (tests/guard.py blocks it); live behaviour is covered by scripts/linux-smoke.
      - name: Unit tests
        run: uv run python -m unittest discover -s tests -t .

  hub:
    # the hub's token checks need the `hub` extra (PyJWT with cryptography); the job above skips those tests
    name: test hub extra (ubuntu-latest, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Unit tests with the hub extra
        run: uv run --extra hub python -m unittest discover -s tests -t .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff
        run: uvx ruff check
